<div id="octopus-design-options" dir="rtl" lang="ar">
<style>
#octopus-design-options{font-family:Tahoma,"Segoe UI",Arial,sans-serif}
#octopus-design-options .ov-stage{min-height:942px;padding:17px 5px 24px}
#octopus-design-options .ov-app{--ac:#b94a21;--on:#fff;--bg:#fbf7ef;--surface:#fffdf8;--ink:#31291f;--muted:#776f63;--line:#e6ddd0;--soft:#f6e4d5;--round:24px;max-width:418px;margin:auto;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:29px;overflow:hidden;box-shadow:0 12px 45px #0000000c;color-scheme:light}
#octopus-design-options .ov-app[data-style="clear"]{--ac:#12656c;--bg:#fff;--surface:#fff;--ink:#173338;--muted:#687c7f;--line:#dfe9e8;--soft:#e7f2f0;--round:15px;border-radius:20px}
#octopus-design-options .ov-app[data-style="night"]{--ac:#c4ec79;--on:#1c2413;--bg:#181c18;--surface:#242a23;--ink:#f4f6ec;--muted:#b7bfb0;--line:#3b4537;--soft:#303e24;--round:19px;color-scheme:dark}
#octopus-design-options .ov-app *{box-sizing:border-box}
#octopus-design-options .ov-app button,#octopus-design-options .ov-app input{font:inherit}
#octopus-design-options .ov-app button{color:inherit}
#octopus-design-options .ov-app button:disabled{opacity:.4;cursor:not-allowed}
#octopus-design-options .ov-app button:focus-visible,#octopus-design-options .ov-app input:focus-visible,#octopus-design-options .ov-app summary:focus-visible{outline:2px solid var(--ac);outline-offset:4px}
#octopus-design-options .ov-header{display:flex;gap:11px;align-items:center;padding:23px 22px 17px}
#octopus-design-options .ov-logo{width:36px;height:36px;background:var(--ac);color:var(--on);border-radius:13px;display:grid;place-items:center;font-size:23px;font-weight:700}
#octopus-design-options .ov-brand{flex:1}
#octopus-design-options .ov-brand strong{font-size:20px;display:block;line-height:1.4}
#octopus-design-options .ov-brand small{font-size:10px;color:var(--muted)}
#octopus-design-options .ov-app[data-style="clear"] .ov-logo{width:30px;height:30px;border-radius:7px;font-size:20px}
#octopus-design-options .ov-app[data-style="clear"] .ov-brand strong{font-size:18px}
#octopus-design-options .ov-app[data-style="night"] .ov-header{border-bottom:1px solid var(--line)}
#octopus-design-options .ov-app[data-style="night"] .ov-logo{background:transparent;color:var(--ac);border:1px solid var(--ac);border-radius:50%}
#octopus-design-options .ov-icon-button{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:var(--surface);display:grid;place-items:center}
#octopus-design-options i[data-lucide],#octopus-design-options svg[data-lucide]{width:18px;height:18px;flex-shrink:0}
#octopus-design-options .ov-demo{font-size:10px;color:var(--muted);line-height:1.7;padding:0 22px 9px}
#octopus-design-options .ov-main{padding:17px 22px 23px;min-height:639px;display:flex;flex-direction:column;gap:18px}
#octopus-design-options .ov-main h2,#octopus-design-options .ov-main h3,#octopus-design-options .ov-main p{margin:0}
#octopus-design-options .ov-main h2{font-size:28px;line-height:1.5;letter-spacing:-.5px;font-weight:700}
#octopus-design-options .ov-main h3{font-size:15px;line-height:1.7;font-weight:600}
#octopus-design-options .ov-muted{font-size:12px;color:var(--muted);line-height:1.85}
#octopus-design-options .ov-small{font-size:11px;line-height:1.8}
#octopus-design-options .ov-accent{color:var(--ac)}
#octopus-design-options .ov-row{display:flex;align-items:center;gap:10px;min-width:0}
#octopus-design-options .ov-between{justify-content:space-between}
#octopus-design-options .ov-grow{flex:1;min-width:0}
#octopus-design-options .ov-address{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
#octopus-design-options .ov-hero{display:flex;align-items:center;gap:10px;position:relative}
#octopus-design-options .ov-hero h2{font-size:31px;line-height:1.5}
#octopus-design-options .ov-hero .ov-hero-food{font-size:69px;transform:rotate(-11deg);line-height:1.5;filter:drop-shadow(0 7px 9px #b94a2112)}
#octopus-design-options .ov-eyebrow{color:var(--ac);font-size:11px;margin-bottom:6px}
#octopus-design-options .ov-search{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;color:var(--muted)}
#octopus-design-options .ov-search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:13px}
#octopus-design-options .ov-chips{display:flex;gap:7px;flex-wrap:wrap}
#octopus-design-options .ov-chip{background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:30px;padding:9px 13px;min-height:40px;font-size:11px}
#octopus-design-options .ov-chip[aria-pressed="true"]{background:var(--ac);color:var(--on);border-color:var(--ac)}
#octopus-design-options .ov-restaurant-list{display:flex;flex-direction:column;gap:12px}
#octopus-design-options .ov-restaurant{border:1px solid var(--line);border-radius:var(--round);background:var(--surface);padding:0;text-align:right;overflow:hidden;width:100%}
#octopus-design-options .ov-food-cover{height:106px;display:flex;align-items:center;justify-content:center;gap:13px;background:var(--soft);font-size:61px}
#octopus-design-options .ov-food-cover .ov-side-food{font-size:32px;align-self:flex-end;padding-bottom:18px}
#octopus-design-options .ov-restaurant-body{padding:15px;display:flex;flex-direction:column;gap:7px}
#octopus-design-options .ov-provider-tags{display:flex;gap:7px;flex-wrap:wrap}
#octopus-design-options .ov-provider-tags span{font-size:10px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
#octopus-design-options .ov-app[data-style="clear"] .ov-restaurant{display:flex;gap:13px;padding:15px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}
#octopus-design-options .ov-app[data-style="clear"] .ov-food-cover{width:77px;height:79px;flex-shrink:0;border-radius:13px;font-size:38px}
#octopus-design-options .ov-app[data-style="clear"] .ov-side-food{display:none}
#octopus-design-options .ov-app[data-style="clear"] .ov-restaurant-body{flex:1;padding:0}
#octopus-design-options .ov-app[data-style="clear"] .ov-restaurant-list{gap:0}
#octopus-design-options .ov-app[data-style="clear"] .ov-main h2{font-size:27px}
#octopus-design-options .ov-step-trail{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#octopus-design-options .ov-step-trail span{flex:1;text-align:center}
#octopus-design-options .ov-step-trail span:first-child{color:var(--ac);font-weight:600}
#octopus-design-options .ov-night-tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
#octopus-design-options .ov-night-tile{display:flex;flex-direction:column;align-items:flex-start;gap:13px;border:1px solid var(--line);border-radius:19px;background:var(--surface);padding:17px;text-align:right}
#octopus-design-options .ov-night-tile .ov-dish{font-size:52px;line-height:1.4;align-self:center}
#octopus-design-options .ov-night-tile strong{font-size:16px}
#octopus-design-options .ov-night-tile small{font-size:11px;color:var(--muted)}
#octopus-design-options .ov-compact-rest{display:flex;gap:12px;align-items:center;background:transparent;border:0;border-bottom:1px solid var(--line);padding:15px 0;width:100%;text-align:right}
#octopus-design-options .ov-mini-food{font-size:26px;width:45px;height:45px;display:grid;place-items:center;background:var(--soft);border-radius:50%;flex-shrink:0}
#octopus-design-options .ov-button{display:flex;justify-content:center;align-items:center;gap:9px;min-height:50px;width:100%;border:1px solid var(--ac);border-radius:15px;padding:13px 15px;background:var(--ac);color:var(--on)!important;font-size:13px;font-weight:600}
#octopus-design-options .ov-button.ov-outline{background:transparent;color:var(--ac)!important;border-color:var(--line)}
#octopus-design-options .ov-link{background:transparent;color:var(--ac)!important;border:0;padding:8px 0;min-height:36px;font-size:12px;display:flex;gap:6px;align-items:center;width:max-content}
#octopus-design-options .ov-panel{border:1px solid var(--line);border-radius:var(--round);padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:13px}
#octopus-design-options .ov-app[data-style="clear"] .ov-panel{border-radius:13px}
#octopus-design-options .ov-menu-line{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:13px 0}
#octopus-design-options .ov-menu-line .ov-mini-food{width:62px;height:66px;border-radius:14px;font-size:35px}
#octopus-design-options .ov-menu-line h3{font-size:13px}
#octopus-design-options .ov-menu-line p{font-size:11px;color:var(--muted);line-height:1.7}
#octopus-design-options .ov-price{font-size:13px;font-weight:600;color:var(--ac);font-variant-numeric:tabular-nums}
#octopus-design-options .ov-add{width:38px;height:38px;flex-shrink:0;display:grid;place-items:center;border:1px solid var(--line);background:var(--soft);color:var(--ac)!important;border-radius:12px}
#octopus-design-options .ov-custom-food{height:99px;display:grid;place-items:center;font-size:66px;background:var(--soft);border-radius:var(--round)}
#octopus-design-options fieldset{border:0;margin:0;padding:0;min-width:0}
#octopus-design-options legend{font-size:14px;font-weight:600;margin-bottom:10px;padding:0}
#octopus-design-options .ov-option{display:flex;align-items:center;gap:9px;min-height:44px;font-size:12px}
#octopus-design-options input[type="radio"],#octopus-design-options input[type="checkbox"]{accent-color:var(--ac);width:17px;height:17px;margin:0}
#octopus-design-options .ov-qty{display:flex;align-items:center;gap:12px}
#octopus-design-options .ov-qty button{border:1px solid var(--line);border-radius:9px;width:34px;height:34px;display:grid;place-items:center;background:var(--surface);color:var(--ink)}
#octopus-design-options .ov-qty output{min-width:18px;text-align:center;font-size:13px}
#octopus-design-options .ov-info{font-size:11px;color:var(--muted);line-height:1.9}
#octopus-design-options .ov-price-line{display:flex;justify-content:space-between;gap:12px;font-size:12px;line-height:1.8}
#octopus-design-options .ov-total{font-size:16px;font-weight:600;padding-top:11px;border-top:1px solid var(--line)}
#octopus-design-options .ov-quote{border:1px solid var(--line);border-radius:var(--round);padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:11px}
#octopus-design-options .ov-quote[data-selected="true"]{border:2px solid var(--ac);padding:15px}
#octopus-design-options .ov-quote-total{font-size:30px;line-height:1.4;font-weight:600;font-variant-numeric:tabular-nums}
#octopus-design-options .ov-best{background:var(--soft);color:var(--ac);font-size:10px;padding:5px 8px;border-radius:20px}
#octopus-design-options .ov-brandmark{height:38px;width:38px;display:grid;place-items:center;border-radius:12px;background:var(--soft);color:var(--ac);font-size:20px;font-weight:600}
#octopus-design-options summary{font-size:11px;line-height:1.9;color:var(--ac);padding:4px 0}
#octopus-design-options .ov-breakdown{display:flex;flex-direction:column;gap:7px;margin:9px 0}
#octopus-design-options .ov-bottom{padding:12px 15px 16px;display:flex;justify-content:space-around;border-top:1px solid var(--line);background:var(--surface)}
#octopus-design-options .ov-bottom button{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:65px;min-height:44px;padding:6px 8px;border-radius:16px;font-size:10px;color:var(--muted)}
#octopus-design-options .ov-bottom button[aria-current="page"]{background:var(--soft);color:var(--ac)}
#octopus-design-options .ov-app[data-style="warm"] .ov-bottom{margin:0 15px 15px;border:1px solid var(--line);border-radius:22px;padding:8px}
#octopus-design-options .ov-app[data-style="clear"] .ov-bottom button[aria-current="page"]{background:transparent;border-radius:0;border-top:2px solid var(--ac)}
#octopus-design-options .ov-app[data-style="night"] .ov-bottom{background:var(--bg)}
#octopus-design-options .ov-app[data-style="night"] .ov-button{border-radius:28px}
#octopus-design-options .ov-app[data-style="night"] .ov-main h2{font-size:32px}
#octopus-design-options .ov-checkmark{width:58px;height:58px;background:var(--soft);color:var(--ac);border-radius:20px;display:grid;place-items:center}
#octopus-design-options .ov-checkmark svg,#octopus-design-options .ov-checkmark i{width:28px;height:28px}
@media(max-width:370px){#octopus-design-options .ov-main{padding:15px 17px 20px;min-height:680px}#octopus-design-options .ov-header{padding-inline:17px}#octopus-design-options .ov-hero h2{font-size:27px}#octopus-design-options .ov-hero .ov-hero-food{font-size:51px}#octopus-design-options .ov-stage{min-height:980px}#octopus-design-options .ov-bottom button{min-width:58px}#octopus-design-options .ov-row{gap:8px}}
@media(pointer:coarse){#octopus-design-options .ov-add,#octopus-design-options .ov-qty button,#octopus-design-options .ov-icon-button{min-height:44px;min-width:44px}}
</style>
<div class="viz-carousel viz-dotted-background" aria-label="خيارات تصميم الأخطبوط" data-previous-label="التصميم السابق" data-next-label="التصميم التالي">
  <section data-variant="كريمي وبرتقالي" aria-label="كريمي وبرتقالي — بطاقات دافئة"><div class="ov-stage"><div id="octopus-warm" class="ov-app" data-style="warm" aria-label="تصميم كريمي وبرتقالي"><header class="ov-header"><span class="ov-logo">أ</span><div class="ov-brand"><strong>الأخطبوط</strong><small>كل اللي تشتهيه، في طلب واحد.</small></div><button type="button" class="ov-icon-button cursor-interaction" data-page="cart" aria-label="طلبي"><i data-lucide="shopping-bag" aria-hidden="true"></i></button></header><div class="ov-demo">تصميم تفاعلي • مطاعم وأسعار توضيحية</div><main class="ov-main" aria-live="polite"></main><nav class="ov-bottom" aria-label="التنقل"></nav></div></div></section>
  <section data-variant="أبيض وبترولي" aria-label="أبيض وبترولي — مقارنة مباشرة" hidden><div class="ov-stage"><div id="octopus-clear" class="ov-app" data-style="clear" aria-label="تصميم أبيض وبترولي"><header class="ov-header"><span class="ov-logo">أ</span><div class="ov-brand"><strong>الأخطبوط</strong><small>اختيار واحد. مقارنة أوضح.</small></div><button type="button" class="ov-icon-button cursor-interaction" data-page="cart" aria-label="طلبي"><i data-lucide="shopping-bag" aria-hidden="true"></i></button></header><div class="ov-demo">تصميم تفاعلي • مطاعم وأسعار توضيحية</div><main class="ov-main" aria-live="polite"></main><nav class="ov-bottom" aria-label="التنقل"></nav></div></div></section>
  <section data-variant="داكن وفستقي" aria-label="داكن وفستقي — اختيار بصري سريع" hidden><div class="ov-stage"><div id="octopus-night" class="ov-app" data-style="night" aria-label="تصميم داكن وفستقي"><header class="ov-header"><span class="ov-logo">أ</span><div class="ov-brand"><strong>الأخطبوط</strong><small>طلبك على مزاجك.</small></div><button type="button" class="ov-icon-button cursor-interaction" data-page="cart" aria-label="طلبي"><i data-lucide="shopping-bag" aria-hidden="true"></i></button></header><div class="ov-demo">تصميم تفاعلي • مطاعم وأسعار توضيحية</div><main class="ov-main" aria-live="polite"></main><nav class="ov-bottom" aria-label="التنقل"></nav></div></div></section>
</div>
<script>
(()=>{
  const outer=document.getElementById('octopus-design-options');
  const restaurants=[{id:'burger',name:'برجر الحديقة',kind:'برجر',emoji:'🍔',side:'🍟',description:'برجر، وجبات وإضافات'},{id:'pizza',name:'فرن الحارة',kind:'بيتزا',emoji:'🍕',side:'🥤',description:'بيتزا وأطباق للمشاركة'}];
  const menu=[{id:'beef',restaurant:'burger',name:'وجبة برجر لحم',description:'مع بطاطس ومشروب غازي',emoji:'🍔',base:2600},{id:'chicken',restaurant:'burger',name:'وجبة دجاج مقرمش',description:'مع بطاطس ومشروب غازي',emoji:'🍗',base:2400},{id:'fries',restaurant:'burger',name:'بطاطس',description:'طبق جانبي',emoji:'🍟',base:800},{id:'margherita',restaurant:'pizza',name:'بيتزا مارغريتا',description:'موزاريلا وصلصة الطماطم',emoji:'🍕',base:3200},{id:'pepperoni',restaurant:'pizza',name:'بيتزا بيبروني',description:'بيبروني وموزاريلا',emoji:'🍕',base:3600},{id:'wedges',restaurant:'pizza',name:'بطاطس ودجز',description:'بطاطس متبلة',emoji:'🥔',base:1000}];
  const money=n=>(n/100).toFixed(2)+' ر.س';
  const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const profiles=[{id:'warm',name:'كريمي وبرتقالي',accent:'#b94a21'},{id:'clear',name:'أبيض وبترولي',accent:'#12656c'},{id:'night',name:'داكن وفستقي',accent:'#c4ec79'}];
  const initial=window.openai?.widgetState?.modelContent;
  const apps={};let lastPublished='';
  function save(){const value={schema:'octopus-design-choices-v1',designs:Object.fromEntries(Object.entries(apps).map(([id,app])=>[id,{page:app.state.page,restaurant:app.state.restaurant,cart:app.state.cart,picked:app.state.picked}]))};lastPublished=JSON.stringify(value);window.openai?.setWidgetState?.({modelContent:value,privateContent:null}).catch(()=>{});}
  function mount(profile){
    const root=document.getElementById('octopus-'+profile.id),main=root.querySelector('.ov-main'),nav=root.querySelector('.ov-bottom');
    const state={page:'home',restaurant:null,cart:[],picked:null,query:'',category:'الكل',notice:''};let draft=null;
    function load(saved){if(!saved)return;state.restaurant=restaurants.some(r=>r.id===saved.restaurant)?saved.restaurant:null;state.cart=(Array.isArray(saved.cart)?saved.cart:[]).filter(x=>menu.some(m=>m.id===x.item&&m.restaurant===state.restaurant)&&Number.isInteger(x.quantity)&&x.quantity>=1&&x.quantity<=10&&typeof x.large==='boolean'&&typeof x.cheese==='boolean').slice(0,15).map(x=>({...x}));state.page=['home','menu','cart','compare','handoff'].includes(saved.page)?saved.page:'home';state.picked=['keeta','hunger'].includes(saved.picked)?saved.picked:null;if(state.page==='menu'&&!state.restaurant)state.page='home';if(state.page==='handoff'&&(!state.picked||!state.cart.length))state.page='cart';}
    if(initial?.schema==='octopus-design-choices-v1')load(initial.designs?.[profile.id]);
    const item=id=>menu.find(x=>x.id===id);
    const restaurant=()=>restaurants.find(r=>r.id===state.restaurant);
    const count=()=>state.cart.reduce((n,x)=>n+x.quantity,0);
    const unit=(x,p='keeta')=>item(x.item).base+(x.large?700:0)+(x.cheese?200:0)+(p==='hunger'&&item(x.item).base>1500?200:0);
    const subtotal=p=>state.cart.reduce((n,x)=>n+unit(x,p)*x.quantity,0);
    const button=(label,action,cls='',disabled=false)=>`<button type="button" class="ov-button cursor-interaction ${cls}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`;
    const intro=(a,b='')=>`<div><h2>${a}</h2>${b?`<p class="ov-muted" style="margin-top:6px">${b}</p>`:''}</div>`;
    const back=(page,label)=>`<button type="button" class="ov-link cursor-interaction" data-page="${page}">${icon('arrow-right')}${label}</button>`;
    const bill=(label,n,total=false)=>`<div class="ov-price-line ${total?'ov-total':''}"><span>${label}</span><span>${money(n)}</span></div>`;
    const qty=(n,id)=>`<div class="ov-qty"><button type="button" class="cursor-interaction" data-qty="${id}" data-delta="-1" aria-label="تقليل الكمية" ${n<=1?'disabled':''}>${icon('minus')}</button><output>${n}</output><button type="button" class="cursor-interaction" data-qty="${id}" data-delta="1" aria-label="زيادة الكمية" ${n>=10?'disabled':''}>${icon('plus')}</button></div>`;
    function quotes(){return ['keeta','hunger'].map(id=>{const items=subtotal(id),delivery=id==='keeta'?800:500,service=id==='keeta'?250:350,discount=id==='keeta'?300:200;return{id,items,delivery,service,discount,total:items+delivery+service-discount};}).sort((a,b)=>a.total-b.total);}
    const provider=id=>id==='keeta'?'كيتا':'هنقرستيشن';
    function list(){const target=root.querySelector('.ov-restaurant-list');if(!target)return;const match=restaurants.filter(r=>(state.category==='الكل'||r.kind===state.category)&&(!state.query||(r.name+' '+r.kind).includes(state.query)));target.innerHTML=match.map(r=>`<button type="button" class="ov-restaurant cursor-interaction" data-restaurant="${r.id}"><div class="ov-food-cover" aria-hidden="true">${r.emoji}<span class="ov-side-food">${r.side}</span></div><div class="ov-restaurant-body"><div class="ov-row ov-between"><h3>${r.name}</h3>${icon('chevron-left')}</div><p class="ov-muted">${r.description}</p><div class="ov-provider-tags"><span>كيتا</span><span>هنقرستيشن</span></div></div></button>`).join('')||'<p class="ov-muted">لا توجد نتائج في قائمة المثال.</p>';icons();}
    function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18,'stroke-width':1.7}});}
    function render(){
      let html='';
      if(state.page==='home'){
        const address=`<div class="ov-address">${icon('map-pin')}<span>المنزل • عنوان توضيحي بالرياض</span></div>`;
        const search=`<label class="ov-search">${icon('search')}<input name="restaurant-search" type="search" aria-label="ابحث عن مطعم" placeholder="ابحث عن مطعمك" value="${esc(state.query)}"></label>`;
        if(profile.id==='warm')html=`${address}<div class="ov-hero"><div class="ov-grow"><div class="ov-eyebrow">لقمة على مزاجك</div><h2>وش مشتهي<br>اليوم؟</h2></div><div class="ov-hero-food" aria-hidden="true">🍔</div></div>${search}<div class="ov-chips">${['الكل','برجر','بيتزا'].map(c=>`<button type="button" class="ov-chip cursor-interaction" data-category="${c}" aria-pressed="${c===state.category}">${c}</button>`).join('')}</div><div class="ov-row ov-between"><h3>مطاعم نبدأ منها</h3><span class="ov-small ov-accent">كيتا + هنقرستيشن</span></div><div class="ov-restaurant-list"></div>`;
        if(profile.id==='clear')html=`${address}${intro('طلب واحد.<br>مقارنة واضحة.','اختر المطعم، أضف وجباتك، ثم قارن الإجمالي.')}<div class="ov-step-trail"><span>١ اختيار المطعم</span>${icon('chevron-left')}<span>٢ تجهيز الطلب</span>${icon('chevron-left')}<span>٣ المقارنة</span></div>${search}<div class="ov-row ov-between"><h3>المطاعم المتاحة في المثال</h3>${icon('utensils')}</div><div class="ov-restaurant-list"></div><div class="ov-panel"><div class="ov-row">${icon('shield-check')}<h3>قارن التكلفة كاملة</h3></div><p class="ov-muted">الأصناف والتوصيل والرسوم والخصومات في نتيجة واحدة.</p></div>`;
        if(profile.id==='night')html=`${address}<div><div class="ov-eyebrow">الأخطبوط / طلبك اليوم</div><h2>ابدأ بشي<br>تشتهيه.</h2></div><div class="ov-night-tiles">${restaurants.map(r=>`<button type="button" class="ov-night-tile cursor-interaction" data-restaurant="${r.id}"><span class="ov-dish" aria-hidden="true">${r.emoji}</span><strong>${r.kind}</strong><small>${r.name}</small><span class="ov-accent">${icon('arrow-up-left')}</span></button>`).join('')}</div><h3>أو اختر المطعم مباشرة</h3>${restaurants.map(r=>`<button type="button" class="ov-compact-rest cursor-interaction" data-restaurant="${r.id}"><span class="ov-mini-food" aria-hidden="true">${r.emoji}</span><div class="ov-grow"><h3>${r.name}</h3><p class="ov-muted">متاح ضمن مثال المنصتين</p></div>${icon('chevron-left')}</button>`).join('')}<p class="ov-info">تختار وجباتك مرة، وتشوف الفرق قبل ما تقرر.</p>`;
        if(count())html+=button(`تابع طلبي (${count()})`,'cart');
      }
      if(state.page==='menu')html=`${back('home','المطاعم')}${intro(restaurant().name,'قائمة توضيحية • اختر الوجبات ثم قارن طلبك')}<div>${menu.filter(x=>x.restaurant===state.restaurant).map(m=>`<div class="ov-menu-line"><span class="ov-mini-food" aria-hidden="true">${m.emoji}</span><div class="ov-grow"><h3>${m.name}</h3><p>${m.description}</p><span class="ov-price">من ${money(m.base)}</span></div><button type="button" class="ov-add cursor-interaction" data-item="${m.id}" aria-label="إضافة ${m.name}">${icon('plus')}</button></div>`).join('')}</div>${count()?button(`مراجعة طلبي (${count()}) • ${money(subtotal('keeta'))}`,'cart'):button('مراجعة طلبي','cart','ov-outline',true)}`;
      if(state.page==='item'&&draft){const m=item(draft.item);html=`${back('menu','قائمة المطعم')}<div class="ov-custom-food" aria-hidden="true">${m.emoji}</div>${intro(m.name,m.description)}<div class="ov-panel"><fieldset><legend>الحجم</legend><label class="ov-option"><input type="radio" name="size" value="regular" data-choice="size" ${!draft.large?'checked':''}><span class="ov-grow">عادي</span><span class="ov-muted">بدون زيادة</span></label><label class="ov-option"><input type="radio" name="size" value="large" data-choice="size" ${draft.large?'checked':''}><span class="ov-grow">كبير</span><span class="ov-muted">+ ${money(700)}</span></label></fieldset><fieldset><legend>الإضافات</legend><label class="ov-option"><input type="checkbox" data-choice="cheese" ${draft.cheese?'checked':''}><span class="ov-grow">جبن إضافي</span><span class="ov-muted">+ ${money(200)}</span></label></fieldset></div><div class="ov-row ov-between"><h3>الكمية</h3>${qty(draft.quantity,'draft')}</div>${button('أضف إلى طلبي • '+money(unit(draft)*draft.quantity),'add')}`;}
      if(state.page==='cart'){
        html=intro('راجع طلبك',count()?restaurant().name:'اختر أول وجبة لبدء المقارنة.');
        if(!count())html+=`<div class="ov-panel"><h3>سلتك فارغة</h3><p class="ov-muted">أضف وجبة من القائمة لتجربة المقارنة.</p>${button('اختيار مطعم','home')}</div>`;
        else html+=`<div class="ov-panel">${state.cart.map((line,i)=>`<div class="ov-row"><div class="ov-grow"><h3>${item(line.item).name}</h3><p class="ov-info">${line.large?'كبير':'عادي'}${line.cheese?' • جبن إضافي':''}</p><span class="ov-price">${money(unit(line)*line.quantity)}</span></div>${qty(line.quantity,String(i))}</div>`).join('')}${bill('مجموع الأصناف التوضيحي',subtotal('keeta'),true)}</div><div class="ov-panel"><h3>نفس الطلب على المنصتين</h3><div class="ov-provider-tags"><span>كيتا</span><span>هنقرستيشن</span></div><p class="ov-muted">المنزل • عنوان توضيحي بالرياض</p></div>${button('قارن الأسعار','compare')}${button('إضافة وجبات أخرى','menu','ov-outline')}`;
      }
      if(state.page==='compare'){
        html=`${back('cart','تعديل الطلب')}${intro('اختر الأنسب لطلبك','النتائج التالية أسعار توضيحية لتجربة التصميم.')}`;
        if(!count())html+=button('أضف وجباتك أولًا','cart');
        else html+=quotes().map((q,i)=>`<div class="ov-quote" data-selected="${q.id===state.picked}"><div class="ov-row"><span class="ov-brandmark">${q.id==='keeta'?'ك':'هـ'}</span><h3 class="ov-grow">${provider(q.id)}</h3>${i===0?'<span class="ov-best">الأقل في المثال</span>':''}</div><div class="ov-quote-total">${money(q.total)}</div><details><summary>تفاصيل المبلغ</summary><div class="ov-breakdown">${bill('الأصناف',q.items)}${bill('التوصيل',q.delivery)}${bill('الخدمة',q.service)}${bill('خصم توضيحي',-q.discount)}${bill('الإجمالي',q.total,true)}</div></details><button type="button" class="ov-button cursor-interaction ${q.id===state.picked?'':'ov-outline'}" data-pick="${q.id}">${q.id===state.picked?'تم اختيار '+provider(q.id):'اختيار '+provider(q.id)}</button></div>`).join('')+(state.picked?button('معاينة الانتقال إلى '+provider(state.picked),'handoff'):'<p class="ov-info">اختر التطبيق، ثم عاين تسليم السلة. لا يتم تنفيذ طلب.</p>');
      }
      if(state.page==='handoff'){
        const q=quotes().find(x=>x.id===state.picked);
        html=`${back('compare','الرجوع للمقارنة')}<div class="ov-checkmark">${icon('check-check')}</div>${intro('سلتك لدى '+provider(q.id),'تصوّر نهاية الرحلة داخل تطبيق التوصيل.')}<div class="ov-panel"><h3>${restaurant().name}</h3><p class="ov-muted">المنزل • عنوان توضيحي</p>${state.cart.map(line=>`<div class="ov-price-line"><span>${line.quantity} × ${item(line.item).name}</span><span>${money(unit(line,q.id)*line.quantity)}</span></div>`).join('')}${bill('تكلفة الطلب في المثال',q.total,true)}</div><p class="ov-info">في التطبيق الفعلي تُراجع السلة وتدفع بنفسك. هذه المعاينة لم تفتح تطبيقًا أو تنشئ طلبًا.</p><button type="button" class="ov-button" disabled>الدفع داخل التطبيق الأصلي</button>${button('العودة إلى طلبي','cart','ov-outline')}`;
      }
      if(!html){state.page='home';return render();}
      main.innerHTML=html;
      const current=['home','menu','item'].includes(state.page)?'home':state.page==='cart'?'cart':'compare';
      nav.innerHTML=[['home','utensils','المطاعم'],['cart','shopping-bag','طلبي'+(count()?' ('+count()+')':'')],['compare','git-compare-arrows','المقارنة']].map(([id,ic,label])=>`<button type="button" class="cursor-interaction" data-page="${id}" ${current===id?'aria-current="page"':''}>${icon(ic)}${label}</button>`).join('');
      if(state.page==='home'&&profile.id!=='night')list();icons();
    }
    root.addEventListener('click',event=>{
      const element=event.target.closest('button');if(!element||!root.contains(element)||element.disabled)return;const d=element.dataset;
      if(d.restaurant){if(state.cart.length&&state.restaurant!==d.restaurant){state.notice='طلبك الحالي من مطعم آخر. أكمل تجربته أو ابدأ من تصميم آخر.';main.innerHTML=`${intro('طلبك من مطعم آخر',state.notice)}${button('العودة إلى طلبي','cart')}${button('بدء طلب جديد من هذا المطعم','replace','ov-outline')}`;state.pending=d.restaurant;return;}state.restaurant=d.restaurant;state.page='menu';}
      else if(d.item){draft={item:d.item,large:false,cheese:false,quantity:1};state.page='item';}
      else if(d.category){state.category=d.category;}
      else if(d.qty){const line=d.qty==='draft'?draft:state.cart[Number(d.qty)];if(line){line.quantity=Math.max(1,Math.min(10,line.quantity+Number(d.delta)));state.picked=null;}}
      else if(d.pick){state.picked=d.pick;}
      else{
        const action=d.page||d.action;
        if(action==='replace'){state.restaurant=state.pending;state.cart=[];state.picked=null;state.page='menu';}
        else if(action==='add'&&draft){const same=state.cart.find(x=>x.item===draft.item&&x.large===draft.large&&x.cheese===draft.cheese&&x.quantity+draft.quantity<=10);if(same)same.quantity+=draft.quantity;else state.cart.push({...draft});draft=null;state.picked=null;state.page='menu';}
        else if(action==='handoff'){if(!state.picked||!count())return;state.page='handoff';}
        else if(['home','menu','cart','compare'].includes(action))state.page=action;
        if(state.page==='menu'&&!state.restaurant)state.page='home';
      }
      render();save();
    });
    root.addEventListener('change',event=>{if(!draft)return;const type=event.target.dataset.choice;if(type==='size')draft.large=event.target.value==='large';if(type==='cheese')draft.cheese=event.target.checked;render();});
    root.addEventListener('input',event=>{if(event.target.name==='restaurant-search'){state.query=event.target.value;list();}});
    render();
    const custom={accent:profile.accent};
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange(){root.style.setProperty('--ac',custom.accent);}});tweak.addColorPicker(custom,'accent',{label:'اللون الأساسي',reference:'--ac'});}
    return {state,load,render};
  }
  profiles.forEach(profile=>{apps[profile.id]=mount(profile);});
  window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.modelContent;if(saved?.schema==='octopus-design-choices-v1'&&JSON.stringify(saved)!==lastPublished){for(const id of Object.keys(apps)){apps[id].load(saved.designs?.[id]);apps[id].render();}}});
})();
</script>
</div>
