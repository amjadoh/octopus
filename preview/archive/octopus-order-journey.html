<div id="octopus-order-journey" class="viz-dotted-background" dir="rtl" lang="ar">
<style>
#octopus-order-journey{font-family:Tahoma,"Segoe UI",Arial,sans-serif;padding:16px 5px;color:#f2f0e9;--oj-bg:#101210;--oj-surface:#1a1c19;--oj-raised:#22251f;--oj-text:#f2f0e9;--oj-muted:#b8b9af;--oj-line:#35392f;--oj-gold:#d9b86d;--oj-soft:#2c291e;--oj-on-gold:#17160f;--oj-danger:#edb1a3;color:var(--oj-text);color-scheme:dark}
#octopus-order-journey[data-theme="light"]{--oj-bg:#f6f3eb;--oj-surface:#fffdf7;--oj-raised:#eee9dc;--oj-text:#24261f;--oj-muted:#686b60;--oj-line:#dbd6c8;--oj-gold:#8a691f;--oj-soft:#eee3c8;--oj-on-gold:#fffdf4;--oj-danger:#9a4332;color-scheme:light}
#octopus-order-journey *{box-sizing:border-box}
#octopus-order-journey button,#octopus-order-journey input{font:inherit}
#octopus-order-journey button:disabled{opacity:.42;cursor:not-allowed}
#octopus-order-journey button:focus-visible,#octopus-order-journey input:focus-visible,#octopus-order-journey summary:focus-visible{outline:2px solid var(--oj-gold);outline-offset:4px}
#octopus-order-journey .oj-stage{max-width:444px;margin:auto}
#octopus-order-journey .oj-preview-controls{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 5px 12px;font-size:11px;color:var(--oj-muted)}
#octopus-order-journey .oj-preview-controls{color-scheme:light dark;color:light-dark(#5d6155,#b8b9af)}
#octopus-order-journey .oj-theme-button{background:var(--oj-surface);color:var(--oj-gold);border:1px solid var(--oj-line);padding:9px 12px;border-radius:30px;font-size:11px;min-height:40px}
#octopus-order-journey .oj-phone{background:var(--oj-bg);border:1px solid var(--oj-line);border-radius:29px;overflow:hidden;position:relative;box-shadow:0 16px 50px #00000012}
#octopus-order-journey .oj-header{padding:21px 21px 15px;display:flex;gap:11px;align-items:center;border-bottom:1px solid var(--oj-line)}
#octopus-order-journey .oj-logo{width:43px;height:43px;display:grid;place-items:center;background:var(--oj-gold);color:var(--oj-on-gold);border-radius:14px;font-size:29px;font-weight:700}
#octopus-order-journey .oj-brand{flex:1;min-width:0}
#octopus-order-journey .oj-brand strong{font-size:23px;display:block;line-height:1.4}
#octopus-order-journey .oj-brand small{font-size:11px;color:var(--oj-muted)}
#octopus-order-journey .oj-icon-button{display:grid;place-items:center;width:43px;min-height:43px;background:transparent;color:var(--oj-text);border:1px solid var(--oj-line);border-radius:14px}
#octopus-order-journey i[data-lucide],#octopus-order-journey svg[data-lucide]{width:19px;height:19px;flex-shrink:0;vertical-align:middle}
#octopus-order-journey .oj-demo{background:var(--oj-soft);color:var(--oj-gold);padding:9px 15px;display:flex;gap:7px;align-items:center;font-size:11px;line-height:1.8}
#octopus-order-journey .oj-main{padding:21px;display:flex;flex-direction:column;gap:20px;min-height:565px}
#octopus-order-journey h2,#octopus-order-journey h3,#octopus-order-journey p{margin:0}
#octopus-order-journey h2{font-size:27px;line-height:1.5;font-weight:700;letter-spacing:-.4px}
#octopus-order-journey h3{font-size:16px;line-height:1.7;font-weight:600}
#octopus-order-journey .oj-subtitle{color:var(--oj-muted);font-size:12px;line-height:1.9;margin-top:5px}
#octopus-order-journey .oj-muted{color:var(--oj-muted);font-size:12px;line-height:1.8}
#octopus-order-journey .oj-small{font-size:11px;line-height:1.8}
#octopus-order-journey .oj-row{display:flex;align-items:center;gap:10px;min-width:0}
#octopus-order-journey .oj-between{justify-content:space-between}
#octopus-order-journey .oj-grow{flex:1;min-width:0}
#octopus-order-journey .oj-gold{color:var(--oj-gold)}
#octopus-order-journey .oj-pill{display:inline-flex;align-items:center;gap:5px;background:var(--oj-soft);color:var(--oj-gold);border-radius:30px;font-size:10px;padding:5px 9px;line-height:1.8}
#octopus-order-journey .oj-address{display:flex;align-items:center;gap:9px;background:transparent;border:0;color:var(--oj-text);text-align:right;width:100%;padding:0;min-height:45px}
#octopus-order-journey .oj-address strong{display:block;font-size:12px;font-weight:500}
#octopus-order-journey .oj-address span{font-size:11px;color:var(--oj-muted)}
#octopus-order-journey .oj-search{display:flex;align-items:center;gap:10px;border:1px solid var(--oj-line);background:var(--oj-surface);padding:12px 14px;border-radius:15px;color:var(--oj-muted)}
#octopus-order-journey .oj-search input{width:100%;min-width:0;outline:0;background:transparent;border:0;color:var(--oj-text);font-size:14px}
#octopus-order-journey .oj-search input::placeholder{color:var(--oj-muted)}
#octopus-order-journey .oj-categories{display:flex;flex-wrap:wrap;gap:8px}
#octopus-order-journey .oj-chip{background:var(--oj-surface);color:var(--oj-muted);border:1px solid var(--oj-line);border-radius:24px;padding:9px 13px;font-size:12px;min-height:42px}
#octopus-order-journey .oj-chip[aria-pressed="true"]{background:var(--oj-gold);border-color:var(--oj-gold);color:var(--oj-on-gold)}
#octopus-order-journey .oj-restaurants{display:flex;flex-direction:column;gap:15px}
#octopus-order-journey .oj-restaurant{border:1px solid var(--oj-line);border-radius:21px;background:var(--oj-surface);padding:0;color:var(--oj-text);width:100%;text-align:right;overflow:hidden}
#octopus-order-journey .oj-food-art{height:112px;display:flex;justify-content:center;align-items:center;background:var(--oj-raised);position:relative;overflow:hidden;gap:13px}
#octopus-order-journey .oj-food-art .oj-food-emoji{font-size:61px;line-height:1.3;filter:drop-shadow(0 8px 12px #0002)}
#octopus-order-journey .oj-food-art .oj-food-side{font-size:36px;align-self:flex-end;margin-bottom:16px}
#octopus-order-journey .oj-food-art:before{content:"";position:absolute;width:150px;height:150px;border:1px solid var(--oj-line);border-radius:50%;transform:rotate(-20deg);opacity:.6}
#octopus-order-journey .oj-restaurant-body{padding:15px 17px;display:flex;flex-direction:column;gap:8px}
#octopus-order-journey .oj-restaurant-name{font-size:17px;font-weight:600}
#octopus-order-journey .oj-provider-pills{display:flex;gap:7px;flex-wrap:wrap}
#octopus-order-journey .oj-provider-pills span{font-size:10px;border:1px solid var(--oj-line);border-radius:7px;padding:3px 7px;color:var(--oj-muted)}
#octopus-order-journey .oj-card{background:var(--oj-surface);border:1px solid var(--oj-line);border-radius:21px;padding:18px;display:flex;flex-direction:column;gap:13px}
#octopus-order-journey .oj-button{background:var(--oj-gold);color:var(--oj-on-gold);border:1px solid var(--oj-gold);border-radius:14px;width:100%;padding:14px 15px;min-height:51px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:9px}
#octopus-order-journey .oj-button.oj-outline{background:transparent;color:var(--oj-gold);border-color:var(--oj-line)}
#octopus-order-journey .oj-button.oj-subtle{background:var(--oj-raised);color:var(--oj-text);border-color:var(--oj-line)}
#octopus-order-journey .oj-link{border:0;background:transparent;color:var(--oj-gold);padding:8px 0;min-height:40px;font-size:12px}
#octopus-order-journey .oj-back{display:flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--oj-muted);padding:0;min-height:33px;font-size:12px;width:max-content}
#octopus-order-journey .oj-menu-item{display:flex;gap:13px;align-items:center;padding:15px;background:var(--oj-surface);border:1px solid var(--oj-line);border-radius:19px}
#octopus-order-journey .oj-thumb{width:74px;height:77px;display:grid;place-items:center;background:var(--oj-raised);border-radius:15px;font-size:37px;flex-shrink:0}
#octopus-order-journey .oj-menu-item h3{font-size:14px}
#octopus-order-journey .oj-menu-item p{font-size:11px;color:var(--oj-muted);line-height:1.8;margin:4px 0 7px}
#octopus-order-journey .oj-item-price{font-size:12px;font-weight:500;color:var(--oj-gold)}
#octopus-order-journey .oj-plus{display:grid;place-items:center;width:38px;height:38px;min-width:38px;border:1px solid var(--oj-line);background:var(--oj-soft);color:var(--oj-gold);border-radius:12px}
#octopus-order-journey .oj-item-hero{height:149px;border-radius:22px;background:var(--oj-raised);display:grid;place-items:center;font-size:83px}
#octopus-order-journey fieldset{margin:0;padding:0;border:0;min-width:0}
#octopus-order-journey legend{font-size:15px;font-weight:600;padding:0;margin-bottom:10px;width:100%;display:flex;align-items:center;gap:8px}
#octopus-order-journey .oj-choice{display:flex;gap:9px;align-items:center;min-height:48px;padding:9px 0;border-bottom:1px solid var(--oj-line);font-size:12px}
#octopus-order-journey .oj-choice:last-child{border:0}
#octopus-order-journey input[type="radio"],#octopus-order-journey input[type="checkbox"]{width:18px;height:18px;accent-color:var(--oj-gold);margin:0;flex-shrink:0}
#octopus-order-journey .oj-quantity{display:inline-flex;align-items:center;gap:16px;background:var(--oj-raised);border-radius:13px;padding:4px}
#octopus-order-journey .oj-quantity button{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:10px;background:var(--oj-surface);color:var(--oj-text)}
#octopus-order-journey .oj-quantity output{font-size:14px;min-width:15px;text-align:center}
#octopus-order-journey .oj-note{display:flex;gap:9px;align-items:flex-start;background:var(--oj-soft);color:var(--oj-gold);font-size:11px;line-height:1.9;padding:13px;border-radius:14px}
#octopus-order-journey .oj-note i,#octopus-order-journey .oj-note svg{margin-top:2px}
#octopus-order-journey .oj-divider{height:1px;background:var(--oj-line);border:0;margin:2px 0}
#octopus-order-journey .oj-bill-row{display:flex;justify-content:space-between;gap:14px;font-size:12px;line-height:1.9}
#octopus-order-journey .oj-bill-row .oj-money{white-space:nowrap;font-variant-numeric:tabular-nums}
#octopus-order-journey .oj-bill-row.oj-total{font-size:15px;font-weight:600;padding-top:8px;border-top:1px solid var(--oj-line)}
#octopus-order-journey .oj-cart-line{display:flex;gap:11px;align-items:flex-start}
#octopus-order-journey .oj-cart-line .oj-thumb{width:58px;height:63px;font-size:29px;border-radius:13px}
#octopus-order-journey .oj-cart-line h3{font-size:13px}
#octopus-order-journey .oj-cart-line p{font-size:11px;line-height:1.8;color:var(--oj-muted);margin:4px 0}
#octopus-order-journey .oj-cart-line .oj-row{flex-wrap:wrap}
#octopus-order-journey .oj-platform{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:var(--oj-soft);color:var(--oj-gold);font-size:23px;font-weight:600;flex-shrink:0}
#octopus-order-journey .oj-offer{border:1px solid var(--oj-line)}
#octopus-order-journey .oj-offer[data-selected="true"]{border:2px solid var(--oj-gold);padding:17px}
#octopus-order-journey .oj-offer-price{font-size:32px;font-weight:600;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
#octopus-order-journey .oj-offer-price small{font-size:12px;color:var(--oj-muted);font-weight:400;letter-spacing:0}
#octopus-order-journey details{font-size:12px;color:var(--oj-muted)}
#octopus-order-journey summary{color:var(--oj-gold);padding:8px 0;min-height:35px}
#octopus-order-journey details .oj-breakdown{display:flex;flex-direction:column;gap:8px;padding:11px 0 4px}
#octopus-order-journey .oj-progress-step{display:flex;gap:11px;align-items:center;color:var(--oj-muted);font-size:13px;line-height:1.7}
#octopus-order-journey .oj-step-dot{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--oj-raised);color:var(--oj-muted);flex-shrink:0}
#octopus-order-journey .oj-progress-step[data-done="true"] .oj-step-dot{background:var(--oj-soft);color:var(--oj-gold)}
#octopus-order-journey .oj-progress-track{height:5px;border-radius:10px;background:var(--oj-raised);overflow:hidden}
#octopus-order-journey .oj-progress-track span{height:100%;display:block;background:var(--oj-gold);transition:width .2s}
#octopus-order-journey .oj-empty{padding:25px 4px;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
#octopus-order-journey .oj-success-mark{width:66px;height:66px;border-radius:23px;display:grid;place-items:center;background:var(--oj-soft);color:var(--oj-gold)}
#octopus-order-journey .oj-success-mark svg,#octopus-order-journey .oj-success-mark i{width:32px;height:32px}
#octopus-order-journey .oj-nav{display:flex;gap:3px;background:var(--oj-surface);border-top:1px solid var(--oj-line);padding:11px 8px 17px}
#octopus-order-journey .oj-nav button{flex:1;border:0;background:transparent;color:var(--oj-muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:52px;min-width:0}
#octopus-order-journey .oj-nav button span{width:54px;height:29px;display:grid;place-items:center;border-radius:20px}
#octopus-order-journey .oj-nav button[aria-current="page"]{color:var(--oj-gold)}
#octopus-order-journey .oj-nav button[aria-current="page"] span{background:var(--oj-soft)}
#octopus-order-journey .oj-dialog-region:not([hidden]){padding:0 21px 21px}
#octopus-order-journey .oj-dialog{border:1px solid var(--oj-gold);background:var(--oj-surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
#octopus-order-journey .oj-error{color:var(--oj-danger);font-size:12px;line-height:1.8}
#octopus-order-journey .oj-notice{color:var(--oj-gold);font-size:12px;line-height:1.9}
#octopus-order-journey [hidden]{display:none!important}
@media(max-width:370px){#octopus-order-journey .oj-main{padding:16px;gap:17px}#octopus-order-journey .oj-header{padding-inline:16px}#octopus-order-journey h2{font-size:24px}#octopus-order-journey .oj-thumb{width:62px;height:70px}#octopus-order-journey .oj-menu-item{gap:9px;padding:12px}#octopus-order-journey .oj-offer-price{font-size:28px}}
@media(prefers-reduced-motion:reduce){#octopus-order-journey *{transition:none!important}}
@media(pointer:coarse){#octopus-order-journey .oj-plus,#octopus-order-journey .oj-icon-button,#octopus-order-journey .oj-quantity button{min-width:44px;min-height:44px}}
</style>
<div class="oj-stage">
  <div class="oj-preview-controls"><span>جرّب رحلة الطلب كاملة</span><button type="button" class="oj-theme-button cursor-interaction" data-action="theme">جرّب العاجي والذهبي</button></div>
  <section class="oj-phone" aria-label="الأخطبوط — تجربة الطلب بالذهبي والأسود">
    <header class="oj-header"><div class="oj-logo" aria-hidden="true">أ</div><div class="oj-brand"><strong>الأخطبوط</strong><small>طلبك واحد. خياراتك أوضح.</small></div><button type="button" class="oj-icon-button cursor-interaction" data-page="providers" aria-label="اختيار تطبيقات التوصيل"><i data-lucide="sliders-horizontal" aria-hidden="true"></i></button></header>
    <div class="oj-demo"><i data-lucide="flask-conical" aria-hidden="true"></i><span>وضع عرض • مطاعم وأسعار توضيحية • لا اتصال بتطبيقات التوصيل</span></div>
    <main class="oj-main" aria-live="polite"></main>
    <div class="oj-dialog-region" hidden></div>
    <nav class="oj-nav" aria-label="التنقل في الأخطبوط"></nav>
  </section>
</div>
<script>
(()=>{
  const root=document.getElementById('octopus-order-journey');
  const main=root.querySelector('.oj-main'),nav=root.querySelector('.oj-nav'),dialog=root.querySelector('.oj-dialog-region');
  const providers=[{id:'keeta',name:'كيتا',mark:'ك'},{id:'hunger',name:'هنقرستيشن',mark:'هـ'}];
  const restaurants=[
    {id:'garden',name:'برجر الحديقة',category:'برجر',emoji:'🍔',side:'🍟',description:'وجبات البرجر والإضافات على ذوقك',branch:'فرع توضيحي • الرياض'},
    {id:'oven',name:'فرن الحارة',category:'بيتزا',emoji:'🍕',side:'🥤',description:'بيتزا وأطباق جانبية للمشاركة',branch:'فرع توضيحي • الرياض'},
    {id:'house',name:'مطبخ الدار',category:'مشويات',emoji:'🍗',side:'🥗',description:'مشويات ووجبات كاملة',branch:'فرع توضيحي • الرياض'}
  ];
  const standardSizes=[{id:'regular',name:'عادي',price:0},{id:'large',name:'كبير',price:700}];
  const drinkOptions=[{id:'cola',name:'مشروب غازي',price:0},{id:'lemon',name:'ليمون بالنعناع',price:400},{id:'water',name:'ماء',price:0}];
  const burgerExtras=[{id:'cheese',name:'جبن إضافي',price:200},{id:'crispy',name:'بصل مقرمش',price:300}];
  const menu=[
    {id:'beef',restaurant:'garden',name:'وجبة برجر لحم',description:'برجر لحم مع بطاطس ومشروب تختاره',emoji:'🍔',base:2600,sizes:standardSizes,drinks:drinkOptions,extras:burgerExtras},
    {id:'chicken',restaurant:'garden',name:'وجبة دجاج مقرمش',description:'دجاج مقرمش مع بطاطس ومشروب',emoji:'🍗',base:2400,sizes:standardSizes,drinks:drinkOptions,extras:burgerExtras},
    {id:'fries',restaurant:'garden',name:'بطاطس',description:'طبق جانبي • اختر الحجم',emoji:'🍟',base:800,sizes:[{id:'regular',name:'عادي',price:0},{id:'large',name:'كبير',price:400}],drinks:[],extras:[{id:'cheese',name:'صوص جبن',price:200}]},
    {id:'garden-water',restaurant:'garden',name:'ماء',description:'عبوة ماء',emoji:'💧',base:300,sizes:[],drinks:[],extras:[]},
    {id:'margherita',restaurant:'oven',name:'بيتزا مارغريتا',description:'جبن موزاريلا وصلصة الطماطم',emoji:'🍕',base:3200,sizes:[{id:'regular',name:'وسط',price:0},{id:'large',name:'كبير',price:1000}],drinks:[],extras:[{id:'cheese',name:'جبن إضافي',price:300},{id:'mushroom',name:'فطر',price:200}]},
    {id:'pepperoni',restaurant:'oven',name:'بيتزا بيبروني',description:'بيبروني وجبن موزاريلا',emoji:'🍕',base:3600,sizes:[{id:'regular',name:'وسط',price:0},{id:'large',name:'كبير',price:1000}],drinks:[],extras:[{id:'cheese',name:'جبن إضافي',price:300},{id:'mushroom',name:'فطر',price:200}]},
    {id:'wedges',restaurant:'oven',name:'بطاطس ودجز',description:'بطاطس متبلة',emoji:'🥔',base:1000,sizes:[],drinks:[],extras:[]},
    {id:'cola-bottle',restaurant:'oven',name:'مشروب غازي',description:'عبوة مشروب غازي',emoji:'🥤',base:500,sizes:[],drinks:[],extras:[]},
    {id:'grill',restaurant:'house',name:'وجبة دجاج مشوي',description:'دجاج مشوي مع الأرز والسلطة',emoji:'🍗',base:2900,sizes:[{id:'regular',name:'نصف دجاجة',price:0},{id:'large',name:'دجاجة كاملة',price:2200}],drinks:[],extras:[{id:'rice',name:'أرز إضافي',price:600},{id:'sauce',name:'صوص إضافي',price:200}]},
    {id:'kebab',restaurant:'house',name:'وجبة كباب',description:'كباب مع الخبز والسلطة',emoji:'🍢',base:3400,sizes:[{id:'regular',name:'عادي',price:0},{id:'large',name:'كبير',price:1200}],drinks:[],extras:[{id:'rice',name:'أرز إضافي',price:600}]},
    {id:'salad',restaurant:'house',name:'سلطة خضراء',description:'خضار طازجة',emoji:'🥗',base:1200,sizes:[],drinks:[],extras:[]}
  ];
  const money=n=>(n/100).toFixed(2)+' ر.س';
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
  const btn=(text,action,extra='',disabled=false)=>`<button type="button" class="oj-button cursor-interaction ${extra}" data-action="${action}" ${disabled?'disabled':''}>${text}</button>`;
  const pill=s=>`<span class="oj-pill">${s}</span>`;
  const note=s=>`<div class="oj-note">${icon('info')}<span>${s}</span></div>`;
  const intro=(title,subtitle)=>`<div><h2>${title}</h2>${subtitle?`<p class="oj-subtitle">${subtitle}</p>`:''}</div>`;
  const back=(page,label)=>`<button type="button" class="oj-back cursor-interaction" data-page="${page}">${icon('arrow-right')}${label}</button>`;
  const bill=(label,value,extra='')=>`<div class="oj-bill-row ${extra}"><span>${label}</span><span class="oj-money">${value}</span></div>`;
  const byId=id=>menu.find(x=>x.id===id);
  const restaurant=()=>restaurants.find(x=>x.id===state.restaurant);
  let state={page:'home',restaurant:null,cart:[],allowed:['keeta','hunger'],address:'home',theme:'dark',selectedProvider:null,quotes:[],category:'الكل',query:'',progress:0,notice:''};

  function quantityControls(value,target){return `<div class="oj-quantity"><button type="button" class="cursor-interaction" data-qty="${target}" data-delta="-1" aria-label="تقليل الكمية" ${value<=1?'disabled':''}>${icon('minus')}</button><output>${value}</output><button type="button" class="cursor-interaction" data-qty="${target}" data-delta="1" aria-label="زيادة الكمية" ${value>=10?'disabled':''}>${icon('plus')}</button></div>`;}
  function cartLines(editable,provider='keeta'){return state.cart.map((line,i)=>`${i?'<hr class="oj-divider">':''}<div class="oj-cart-line"><div class="oj-thumb" aria-hidden="true">${byId(line.item).emoji}</div><div class="oj-grow"><h3>${byId(line.item).name}</h3><p>${summary(line)}</p><div class="oj-row oj-between"><span class="oj-item-price">${money(unit(line,provider)*line.quantity)}</span><span class="oj-small oj-muted">الكمية ${line.quantity}</span></div>${editable?`<div class="oj-row oj-between">${quantityControls(line.quantity,String(line.id))}<button type="button" class="oj-link cursor-interaction" data-edit="${line.id}">تعديل</button><button type="button" class="oj-icon-button cursor-interaction" data-remove="${line.id}" aria-label="حذف ${byId(line.item).name}">${icon('trash-2')}</button></div>`:''}</div></div>`).join('');}
  function calculateQuotes(){return state.allowed.map(id=>{
    const items=subtotal(id),delivery=id==='keeta'?800:500,service=id==='keeta'?250:350,small=items<3500?500:0;
    const discount=id==='keeta'?(items>=5000?1000:300):(items>=5000?700:200);
    const total=items+delivery+service+small-discount,wallet=id==='hunger'?Math.min(1500,total):0;
    return {id,items,delivery,service,small,discount,total,wallet};
  }).sort((a,b)=>a.total-b.total);}
  function providerName(id){return providers.find(p=>p.id===id)?.name||'';}
  function providerMark(id){return providers.find(p=>p.id===id)?.mark||'';}
  function breakdown(q){return `${bill('الأصناف',money(q.items))}${bill('رسوم التوصيل',money(q.delivery))}${bill('رسوم الخدمة',money(q.service))}${bill('رسوم الطلب الصغير',money(q.small))}${bill('الخصم المطبق في المثال','−'+money(q.discount))}<p class="oj-small oj-muted">الضريبة مشمولة في المبالغ التوضيحية؛ لا تُضاف مرة ثانية.</p>${bill('تكلفة الطلب',money(q.total),'oj-total')}`;}
  function offer(q,index){const chosen=state.selectedProvider===q.id;return `<div class="oj-card oj-offer" data-selected="${chosen}"><div class="oj-row"><div class="oj-platform">${providerMark(q.id)}</div><div class="oj-grow"><h3>${providerName(q.id)}</h3><p class="oj-small oj-muted">سلة مطابقة ضمن المثال</p></div>${index===0?pill('الأقل في المثال'):''}</div><div class="oj-row oj-between"><div class="oj-offer-price">${money(q.total).replace(' ر.س','')} <small>ر.س</small></div>${chosen?`<span class="oj-gold">${icon('check-circle-2')}</span>`:''}</div><details><summary>تفاصيل الرسوم والخصم</summary><div class="oj-breakdown">${breakdown(q)}${q.wallet?bill('رصيد محفظة تجريبي منفصل',money(q.wallet)):''}${bill('المتبقي للدفع',money(q.total-q.wallet))}</div></details><button type="button" class="oj-button cursor-interaction ${chosen?'':'oj-outline'}" data-provider-pick="${q.id}">${chosen?'تم اختيار '+providerName(q.id):'اختيار '+providerName(q.id)}</button></div>`;}
  function chooseRestaurant(id){
    if(!restaurants.some(x=>x.id===id))return;
    if(state.cart.length&&state.restaurant!==id){pendingRestaurant=id;showDialog('تغيير المطعم؟','طلبك الحالي من '+restaurant().name+'. للبدء من مطعم آخر يجب إفراغ سلة المثال الحالية.',btn('إفراغ سلة المثال والمتابعة','confirm-restaurant')+btn('الاحتفاظ بطلبي','close','oj-outline'));return;}
    state.restaurant=id;state.page='menu';state.notice='';render();persist();
  }
  function showDialog(title,body,actions){dialog.innerHTML=`<section class="oj-dialog" role="dialog" aria-label="${esc(title)}"><h3>${title}</h3><p class="oj-muted">${body}</p>${actions}</section>`;dialog.hidden=false;refreshIcons();}
  function openItem(id,editId=null){const item=byId(id);if(!item||item.restaurant!==state.restaurant)return;const existing=state.cart.find(x=>x.id===editId);draft=existing?{...existing,extras:[...existing.extras],editId}:{item:id,size:item.sizes[0]?.id||null,drink:null,extras:[],quantity:1,editId:null};state.page='item';render();persist();}
  function addDraft(){
    if(!draft)return;const item=byId(draft.item);if(item.drinks.length&&!item.drinks.some(x=>x.id===draft.drink))return;
    const signature=x=>JSON.stringify([x.item,x.size,x.drink,[...x.extras].sort()]);
    let cart=state.cart.filter(x=>x.id!==draft.editId);
    const existing=cart.find(x=>signature(x)===signature(draft));
    if(existing&&existing.quantity+draft.quantity<=10)existing.quantity+=draft.quantity;
    else cart.push({id:draft.editId||nextId++,item:draft.item,size:draft.size,drink:draft.drink,extras:[...draft.extras],quantity:draft.quantity});
    state.cart=cart;invalidate();draft=null;state.page='menu';state.notice='';render();persist();
  }
  function compare(){
    if(!state.cart.length||state.allowed.length<2)return;
    invalidate();const token=runId;state.page='progress';state.progress=0;state.notice='';render();persist();
    function next(){if(token!==runId||state.page!=='progress')return;state.progress++;if(state.progress>=5){state.quotes=calculateQuotes();state.page='results';state.selectedProvider=null;render();persist();}else{render();setTimeout(next,500);}}
    setTimeout(next,400);
  }
  function goto(page){
    if(state.page==='progress'){runId++;state.notice='أوقفت محاكاة المقارنة؛ لم تتغير أي سلة حقيقية.';}
    if(page==='menu'&&!state.restaurant)page='home';
    state.page=page;draft=null;render();persist();
  }
  root.addEventListener('click',event=>{
    const element=event.target.closest('button');if(!element||!root.contains(element)||element.disabled)return;const d=element.dataset;
    if(d.restaurant){chooseRestaurant(d.restaurant);return;}
    if(d.category){state.category=d.category;render();persist();return;}
    if(d.item){openItem(d.item);return;}
    if(d.edit){const line=state.cart.find(x=>x.id===Number(d.edit));if(line)openItem(line.item,line.id);return;}
    if(d.remove){state.cart=state.cart.filter(x=>x.id!==Number(d.remove));invalidate();render();persist();return;}
    if(d.qty){const line=d.qty==='draft'?draft:state.cart.find(x=>x.id===Number(d.qty));if(line){line.quantity=Math.max(1,Math.min(10,line.quantity+Number(d.delta)));if(d.qty!=='draft')invalidate();render();persist();}return;}
    if(d.providerPick){if(state.quotes.some(q=>q.id===d.providerPick)){state.selectedProvider=d.providerPick;render();persist();}return;}
    if(d.address){state.address=d.address==='work'?'work':'home';invalidate();if(['results','ready','handoff','progress'].includes(state.page))state.page='cart';render();persist();return;}
    if(d.page){goto(d.page);return;}
    const action=d.action;
    if(['home','menu','cart','providers','more','diagnostic','history'].includes(action)){goto(action);return;}
    if(action==='theme'){state.theme=state.theme==='dark'?'light':'dark';render();persist();return;}
    if(action==='address'){showDialog('عنوان التوصيل','العناوين هنا أمثلة لا تستخدم موقعك الفعلي.',`<button type="button" class="oj-button cursor-interaction" data-address="home">المنزل • عنوان توضيحي</button><button type="button" class="oj-button oj-outline cursor-interaction" data-address="work">العمل • عنوان توضيحي</button>`);return;}
    if(action==='confirm-restaurant'&&pendingRestaurant){const id=pendingRestaurant;pendingRestaurant=null;state.cart=[];invalidate();chooseRestaurant(id);return;}
    if(action==='close'){pendingRestaurant=null;dialog.hidden=true;return;}
    if(action==='add'){addDraft();return;}
    if(action==='compare'){compare();return;}
    if(action==='cancel'){runId++;state.notice='أوقفت محاكاة المقارنة؛ لم تتغير أي سلة حقيقية.';goto('cart');return;}
    if(action==='ready'&&state.quotes.some(q=>q.id===state.selectedProvider)){state.page='ready';render();persist();return;}
    if(action==='handoff'&&state.quotes.some(q=>q.id===state.selectedProvider)){state.page='handoff';render();persist();}
  });
  root.addEventListener('input',event=>{if(event.target.name==='restaurant-search'){state.query=event.target.value;drawRestaurantList();}});
  root.addEventListener('change',event=>{
    const target=event.target;
    if(target.dataset.provider){const id=target.dataset.provider;if(!providers.some(p=>p.id===id))return;state.allowed=target.checked?[...new Set([...state.allowed,id])]:state.allowed.filter(x=>x!==id);invalidate();render();persist();return;}
    if(target.dataset.choice&&draft){const field=target.dataset.choice,item=byId(draft.item),allowed=field==='size'?item.sizes:field==='drink'?item.drinks:item.extras;if(!allowed.some(x=>x.id===target.value))return;if(field==='extras')draft.extras=target.checked?[...new Set([...draft.extras,target.value])]:draft.extras.filter(x=>x!==target.value);else draft[field]=target.value;render();}
  });
  window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.modelContent;if(saved?.schema==='octopus-order-demo-v1'&&snapshotKey(saved)!==lastPublished){runId++;restore(saved);state.quotes=[];state.selectedProvider=null;draft=null;render();}});
  render();
})();
</script>
</div>
