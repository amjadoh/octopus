name: Android diagnostic checks
on:
  workflow_dispatch:
  pull_request:
    branches: [main, fix/cart-total-reading, codex/preview-1-3-3]
permissions:
  contents: read
jobs:
  ai-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate recovery decisions, privacy boundary, authentication and rate limits
        run: node --test server/ai-recovery.test.mjs
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build, unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDiagnosticDebug :app:assembleDiagnosticDebugAndroidTest :app:testDiagnosticDebugUnitTest :app:lintDiagnosticDebug
      - name: Keep experimental debug APK
        uses: actions/upload-artifact@v4
        with:
          name: octopus-single-app
          path: app/build/outputs/apk/diagnostic/debug/*.apk
          retention-days: 7
      - name: Enable emulator acceleration
        run: |
          # Only the disposable GitHub runner: this Kotlin build does not use .NET.
          if [ -d /usr/share/dotnet ]; then sudo rm -rf -- /usr/share/dotnet; fi
          df -h "$HOME"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test startup and settings on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDiagnosticDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notAnnotation=app.octopus.local.LivePublicNetwork
      - name: Keep Android UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-evidence
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
