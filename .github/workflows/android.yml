name: Android diagnostic checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build, unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDiagnosticDebug :app:assembleDemoDebug :app:assembleDiagnosticDebugAndroidTest :app:assembleDemoDebugAndroidTest :app:testDiagnosticDebugUnitTest :app:testDemoDebugUnitTest :app:lintDiagnosticDebug :app:lintDemoDebug
      - name: Keep experimental debug APK
        uses: actions/upload-artifact@v4
        with:
          name: octopus-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 7
