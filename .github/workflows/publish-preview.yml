name: Publish experimental APKs
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: octopus-preview-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Restore stable preview signing
        env:
          OCTOPUS_PREVIEW_SIGNING: ${{ secrets.OCTOPUS_PREVIEW_SIGNING }}
        run: python3 .github/scripts/restore_preview_signing.py
      - name: Build and check single experimental app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDiagnosticDebug :app:testDiagnosticDebugUnitTest :app:lintDiagnosticDebug :app:assembleDiagnosticDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          # This is GitHub's disposable Ubuntu runner, not the user's computer.
          # The preinstalled .NET SDK is unused by this Kotlin-only project.
          if [ -d /usr/share/dotnet ]; then sudo rm -rf -- /usr/share/dotnet; fi
          df -h "$HOME"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual startup and settings UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDiagnosticDebugAndroidTest
      - name: Keep UI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-evidence
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
      - name: Verify APKs and prepare release files
        run: |
          python3 .github/scripts/prepare_preview.py
          git archive --format=zip --prefix=octopus-android/ HEAD -o release/octopus-source-1.0.0.zip
          cp docs/TEST_ON_PHONE.md release/TEST_ON_PHONE.md
          cp docs/PREVIEW_RELEASE.md release/release-notes.md
          cd release
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: verified-preview-files
          path: release/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v1.0.0-alpha
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-preview-files
          path: release
      - name: Attach verified files to draft
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > draft-state.txt; then
            test "$(cat draft-state.txt)" = true
          else
            gh release create "$RELEASE_TAG" --draft --prerelease --target "$GITHUB_SHA" --title 'الأخطبوط 1.0.0 — إصلاح الإغلاق عند التشغيل' --notes-file release/release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft --prerelease --target "$GITHUB_SHA" --notes-file release/release-notes.md
          gh release upload "$RELEASE_TAG" release/octopus-1.0.0.apk release/octopus-source-1.0.0.zip release/validation-summary-ci.json release/SHA256SUMS.txt release/TEST_ON_PHONE.md
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > asset-names.txt
          grep -Fx 'octopus-1.0.0.apk' asset-names.txt
      - name: Publish prerelease after successful upload
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease,assets
