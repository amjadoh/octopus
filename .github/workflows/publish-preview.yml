name: Publish experimental APKs
on:
  workflow_dispatch:
  push:
    branches: [codex/preview-1-3-3]
permissions:
  contents: read
concurrency:
  group: octopus-preview-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate explicitly requested preview or complete-comparison release
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('docs/COMPARISON_RELEASE_GATE.json').read_text(encoding='utf-8'))
          plan = json.loads(Path('docs/RELEASE_PLAN.json').read_text(encoding='utf-8'))
          if plan.get('scope') == 'preview_current_work':
              assert plan.get('userRequestedPreview') is True and plan.get('prerelease') is True
              assert plan.get('realComparisonComplete') is False
              assert plan.get('tag') == 'v1.3.10-alpha' and plan.get('version') == '1.3.10' and plan.get('versionCode') == 18
              notes = Path('docs/PREVIEW_RELEASE.md').read_text(encoding='utf-8')
              assert 'المقارنة الفعلية وتجهيز سلتَي كيتا وهنقرستيشن غير مكتملين' in notes
          else:
              checks = ['ready', 'realProviderCartPreparationVerified', 'realFinalTotalsVerified', 'realTwoProviderComparisonVerified', 'realSelectedCartHandoffVerified']
              assert all(evidence.get(key) is True for key in checks), 'Release blocked: actual comparison/cart/handoff is not verified'
              assert set(evidence.get('providersVerified', [])) == {'keeta', 'hungerstation'}, 'Both real providers are required'
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Restore stable preview signing
        env:
          OCTOPUS_PREVIEW_SIGNING: ${{ secrets.OCTOPUS_PREVIEW_SIGNING }}
        run: python3 .github/scripts/restore_preview_signing.py
      - name: Build and check single experimental app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDiagnosticDebug :app:testDiagnosticDebugUnitTest :app:lintDiagnosticDebug :app:assembleDiagnosticDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          # This is GitHub's disposable Ubuntu runner, not the user's computer.
          # The preinstalled .NET SDK is unused by this Kotlin-only project.
          if [ -d /usr/share/dotnet ]; then sudo rm -rf -- /usr/share/dotnet; fi
          df -h "$HOME"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual startup and settings UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDiagnosticDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notAnnotation=app.octopus.local.LivePublicNetwork
      - name: Keep UI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-evidence
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
      - name: Verify APKs and prepare release files
        run: |
          python3 .github/scripts/prepare_preview.py
          git archive --format=zip --prefix=octopus-android/ HEAD -o release/octopus-source-1.3.10.zip
          cp docs/TEST_ON_PHONE.md release/TEST_ON_PHONE.md
          cp docs/PREVIEW_RELEASE.md release/release-notes.md
          cd release
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: verified-preview-files
          path: release/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v1.3.10-alpha
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-preview-files
          path: release
      - name: Attach verified files to draft
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > draft-state.txt; then
            test "$(cat draft-state.txt)" = true
          else
            gh release create "$RELEASE_TAG" --draft --prerelease --target "$GITHUB_SHA" --title 'الأخطبوط 1.3.10 — آخر إصلاحات المقارنة والتحديث (تجريبي)' --notes-file release/release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft --prerelease --target "$GITHUB_SHA" --notes-file release/release-notes.md
          gh release upload "$RELEASE_TAG" release/octopus-1.3.10.apk release/octopus-source-1.3.10.zip release/validation-summary-ci.json release/SHA256SUMS.txt release/TEST_ON_PHONE.md
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > asset-names.txt
          grep -Fx 'octopus-1.3.10.apk' asset-names.txt
      - name: Publish prerelease after successful upload
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease,assets

