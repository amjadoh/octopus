name: Signed Honor device test (no release)
on:
  push:
    branches: [codex/honor-ridan-test]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/**'
      - 'docs/PREVIEW_SIGNING_CERT_SHA256.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Restore existing signing identity in temporary runner storage
        env:
          OCTOPUS_PREVIEW_SIGNING: ${{ secrets.OCTOPUS_PREVIEW_SIGNING }}
        run: python3 .github/scripts/restore_preview_signing.py
      - name: Build and test without publishing
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDiagnosticDebug :app:testDiagnosticDebugUnitTest :app:lintDiagnosticDebug
      - name: Verify certificate before upload
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/diagnostic/debug/app-diagnostic-debug.apk > certificate.txt
          expected=$(tr -d '\r\n' < docs/PREVIEW_SIGNING_CERT_SHA256.txt)
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' certificate.txt)
          test "$actual" = "$expected"
      - uses: actions/upload-artifact@v4
        with:
          name: honor-signed-device-test
          path: |
            app/build/outputs/apk/diagnostic/debug/app-diagnostic-debug.apk
            app/build/test-results/testDiagnosticDebugUnitTest/TEST-*.xml
          if-no-files-found: error
          retention-days: 90
